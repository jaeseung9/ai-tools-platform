<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - AI Tools Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
        }

        .tab-container {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .email-login-btn {
            background: #667eea;
            color: white;
        }

        .naver-btn {
            background: #03C75A;
            color: white;
        }

        .kakao-btn {
            background: #FEE500;
            color: #000000;
        }

        .signup-link {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1> AI Tools Platform</h1>
    <p class="subtitle">로그인하고 AI 도구를 사용하세요</p>

    <!-- 탭 -->
    <div class="tab-container">
        <div class="tab active" data-tab="email">이메일 로그인</div>
        <div class="tab" data-tab="social">소셜 로그인</div>
    </div>

    <!-- 이메일 로그인 탭 -->
    <div id="emailTab" class="tab-content active">
        <form id="loginForm">
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" required placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <button type="submit" class="btn email-login-btn">
                로그인
            </button>
        </form>

        <div class="signup-link">
            계정이 없으신가요? <a href="/signup.html">회원가입</a>
        </div>
    </div>

    <!-- 소셜 로그인 탭 -->
    <div id="socialTab" class="tab-content">
        <a href="/oauth2/authorization/naver" class="btn naver-btn">
            네이버로 로그인
        </a>

        <a href="/oauth2/authorization/kakao" class="btn kakao-btn">
            카카오로 로그인
        </a>
    </div>
</div>

<script>
    // 탭 전환
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', function() {
            const tabName = this.getAttribute('data-tab');

            // 탭 버튼 활성화
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');

            // 탭 컨텐츠 표시
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            if (tabName === 'email') {
                document.getElementById('emailTab').classList.add('active');
            } else {
                document.getElementById('socialTab').classList.add('active');
            }
        });
    });

    // 이메일 로그인
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                location.href = '/';
            } else {
                const data = await response.json();
                errorMsg.textContent = data.message || '로그인에 실패했습니다.';
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            errorMsg.textContent = '서버 오류가 발생했습니다.';
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
